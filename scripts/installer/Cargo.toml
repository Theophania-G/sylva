[package]
name = "sylva-installer"
version = "0.1.0"
edition = "2021"

# 独立于主工作区（打包工具，不参与主工程的 workspace）
[workspace]

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# 把 sylva.ico 编译进安装器 exe 资源（与主程序同一个图标）
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
